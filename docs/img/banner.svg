<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lemon POS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>

  <!-- limones decorativos -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10">
    <circle cx="1040" cy="70" r="120"/>
    <circle cx="1040" cy="70" r="70"/>
    <circle cx="1130" cy="270" r="90"/>
  </g>

  <!-- logo -->
  <g transform="translate(80 96)">
    <ellipse cx="54" cy="54" rx="54" ry="54" fill="#ffffff"/>
    <ellipse cx="54" cy="54" rx="40" ry="40" fill="none" stroke="#16a34a" stroke-width="6"/>
    <path d="M54 14 V94 M14 54 H94 M26 26 L82 82 M82 26 L26 82" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="220" y="148" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Lemon POS</text>
  <text x="222" y="196" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#f0fdf4">Punto de venta para negocios de Ecuador</text>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#14532d">
    <rect x="222" y="224" width="120" height="34" rx="17" fill="#f0fdf4"/>
    <text x="282" y="247" text-anchor="middle">Ventas</text>
    <rect x="354" y="224" width="130" height="34" rx="17" fill="#f0fdf4"/>
    <text x="419" y="247" text-anchor="middle">Inventario</text>
    <rect x="496" y="224" width="120" height="34" rx="17" fill="#f0fdf4"/>
    <text x="556" y="247" text-anchor="middle">Crédito</text>
    <rect x="628" y="224" width="150" height="34" rx="17" fill="#f0fdf4"/>
    <text x="703" y="247" text-anchor="middle">Factura SRI</text>
  </g>
</svg>
